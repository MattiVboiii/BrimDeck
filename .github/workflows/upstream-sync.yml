name: Sync upstream into fork
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository_owner == 'MattiVboiii'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/MoFeng2223/BrimDeck.git 2>/dev/null || git remote set-url upstream https://github.com/MoFeng2223/BrimDeck.git
          git fetch upstream main
          git checkout main
          git merge --ff-only upstream/main
          git push origin main
      - name: Ensure a single open PR from main into matti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin matti
          behind="$(git rev-list --count origin/matti..origin/main)"
          if [ "$behind" -eq 0 ]; then
            echo "matti already includes main."
            exit 0
          fi
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base matti --head main --state open --json number --jq '.[0].number // empty')"
          body="This PR fast-forwards \`matti\` with upstream changes already merged into \`main\` (${behind} commit(s) on \`main\` not in \`matti\`).

Review the diff, resolve conflicts if any, then merge manually. This workflow never auto-merges."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --base matti --head main --title "Sync upstream main into matti" --body "$body"
          fi