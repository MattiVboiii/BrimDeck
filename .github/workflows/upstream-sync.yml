name: Sync upstream into fork
on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    if: github.repository_owner == 'MattiVboiii'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
      - name: Ensure a single open PR from main into matti
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main matti
          behind="$(git rev-list --count origin/matti..origin/main)"
          if [ "$behind" -eq 0 ]; then
            echo "matti already includes main."
            exit 0
          fi
          existing="$(gh pr list --repo "${GITHUB_REPOSITORY}" --base matti --head main --state open --json number --jq '.[0].number // empty')"
          body="$(printf 'This PR brings upstream changes from main into matti (%s commit(s) on main not in matti).\n\nReview the diff, resolve conflicts if any, then merge manually. This workflow never auto-merges.' "$behind")"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --base matti --head main --title "Sync upstream main into matti" --body "$body"
          fi